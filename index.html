<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shakk - Chess</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="menu">
            <h1>Shakk Chess</h1>
            <p>Choose how you want to play</p>
            <button onclick="startSinglePlayer()">Single Player</button>
            <button onclick="findMatch()">Find Online Match</button>
        </div>

        <div id="game" style="display:none;">
            <h1>Shakk Chess</h1>
            <div id="status">White to move</div>
            <div id="board"></div>
            <div class="controls">
                <button onclick="showMenu()">Back to Menu</button>
                <button onclick="resetCurrentGame()">Reset Game</button>
            </div>
            <p id="info"></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="script.js?v=4"></script>
</body>
</html>
