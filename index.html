<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shakk - Chess</title>
    <link rel="stylesheet" href="style.css">
    <style>
    .brilliant { position: relative; }
    .brilliant::after {
        content: "!!"; position: absolute; top: -7px; right: -8px;
        background: #22c55e; color: #fff; font: 800 11px/18px Arial,sans-serif;
        border-radius: 50%; width: 18px; height: 18px; text-align: center;
        box-shadow: 0 2px 7px #14532d99;
    }

    /* Shakk Rule Book — clean, modern in-game reference */
    #ruleBook {
        display: none; position: fixed; inset: 0; z-index: 1000;
        justify-content: center; align-items: center; padding: 20px;
        background: rgba(12, 18, 14, .78); backdrop-filter: blur(7px);
    }
    .book {
        width: min(760px, 100%); min-height: 360px; max-height: min(620px, 90vh);
        background: #202a24; color: #f4f7f2; border: 1px solid #45564a;
        border-radius: 18px; box-shadow: 0 24px 80px #0009;
        display: grid; grid-template-columns: 230px 1fr; overflow: hidden; position: relative;
    }
    .page { box-sizing: border-box; padding: 30px; min-width: 0; }
    #leftPage { background: #29372e; border-right: 1px solid #435247; }
    #rightPage { padding: 42px 38px 34px; }
    .page h2 { margin: 0 0 14px; color: #f4f7f2; font-size: 23px; letter-spacing: -.4px; }
    .page p { color: #cbd5ce; line-height: 1.7; font-size: 15px; margin: 0; }
    .page-number { color: #9bb5a0; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; }
    #leftTitle { font-size: 18px; }
    #leftText { color: #aebdb2; font-size: 13px; }
    #rightTitle { font-size: 27px; }
    #closeBook {
        position: absolute; top: 14px; right: 14px; z-index: 2;
        width: 34px; height: 34px; border: 0; border-radius: 9px;
        background: #35443a; color: #eaf1eb; font-size: 20px; cursor: pointer;
    }
    #closeBook:hover { background: #49614f; }
    @media (max-width: 560px) {
        .book { grid-template-columns: 1fr; max-height: 90vh; overflow-y: auto; }
        #leftPage { padding: 22px 24px; border-right: 0; border-bottom: 1px solid #435247; }
        #rightPage { padding: 28px 24px; }
        #leftTitle { margin-bottom: 6px; }
    }
    </style>
</head>
<body>
    <div class="container">
        <div id="auth">
            <h1>Shakk Chess</h1>
            <p>Sign in or create an account to play</p>
            <input type="email" id="email" placeholder="Email"><br><br>
            <input type="password" id="password" placeholder="Password"><br><br>
            <button onclick="doSignIn()">Sign In</button>
            <button onclick="doSignUp()">Sign Up</button>
            <p id="authMessage"></p>
        </div>
        <div id="menu" style="display:none;">
            <h1>Shakk Chess</h1>
            <p id="welcome">Welcome!</p>
            <p id="eloDisplay">ELO: 200</p>
            <button onclick="startSingle()">Single Player</button>
            <button onclick="startOnline()">Find Online Match</button>
            <button onclick="openRuleBook()">Rule Book</button>
            <button onclick="doSignOut()">Sign Out</button>
        </div>
        <div id="game" style="display:none;">
            <h1>Shakk Chess</h1>
            <div id="status">White to move</div>
            <div id="board"></div>
            <div class="controls">
                <button onclick="backToMenu()">Back to Menu</button>
                <button onclick="resetGame()">Reset</button>
                <button onclick="openRuleBook()">Rule Book</button>
            </div>
            <p id="info"></p>
        </div>
    </div>

    <div id="ruleBook" role="dialog" aria-modal="true" aria-label="Shakk Rule Book">
        <div class="book">
            <button id="closeBook" onclick="closeRuleBook()" aria-label="Close rule book">×</button>
            <div class="page" id="leftPage">
                <div class="page-number">SHAKK • FIELD GUIDE</div>
                <h2 id="leftTitle">Rule Book</h2>
                <p id="leftText">Rules you've discovered will appear here.</p>
                <div class="page-number" id="leftNum" style="margin-top:24px"></div>
            </div>
            <div class="page" id="rightPage">
                <div class="page-number" id="rightNum">DISCOVERED RULE</div>
                <h2 id="rightTitle">No rules discovered yet</h2>
                <p id="rightText">Play games to discover Shakk's unusual rules.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
    const SUPABASE_URL = 'https://devxzklnldwhyxrlorck.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_X7YnI_XIJUZi1tfklN6-FQ_RpVEDKy1';
    window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    window.currentUser = null;
    window.myElo = 200;
    window.chess = new Chess();
    window.mode = null;
    window.currentGameId = null;
    window.myColor = null;
    window.selectedSquare = null;
    window.possibleMoves = [];
    window.channel = null;
    window.gameEnded = false;
    window.brilliantPawns = new Set();
    window.lastMoveSquares = [];
    window.sessionDiscoveredRules = new Set();
    let soundContext = null;

    // Rules: numbered by when added. Discovered ones are visible.
    const ALL_RULES = [
        {
            num: 1,
            title: "Brilliant Pawn",
            text: "When two pawns stand directly in front of each other, your pawn may move 1 step to the right (same rank) and become a Brilliant Pawn. It gets a green !! icon and cannot be captured by other pawns."
        }
        // Future rules go here with higher numbers
    ];

    const DISCOVERED_RULES_KEY = 'shakk_discovered_rules';

    function getDiscovered() {
        if (window.currentUser) {
            const accountRules = window.currentUser.user_metadata?.[DISCOVERED_RULES_KEY];
            return [...new Set([...(Array.isArray(accountRules) ? accountRules : []), ...window.sessionDiscoveredRules])];
        }
        return JSON.parse(localStorage.getItem('discoveredRules') || '[]');
    }

    async function syncDiscoveredRulesToAccount() {
        if (!window.currentUser) return;
        const merged = getDiscovered();
        const existing = window.currentUser.user_metadata?.[DISCOVERED_RULES_KEY] || [];
        if (JSON.stringify([...existing].sort()) === JSON.stringify([...merged].sort())) return;
        const metadata = { ...(window.currentUser.user_metadata || {}), [DISCOVERED_RULES_KEY]: merged };
        const { data, error } = await window.supabaseClient.auth.updateUser({ data: metadata });
        if (!error && data?.user) window.currentUser = data.user;
    }

    async function discoverRule(num) {
        const discovered = getDiscovered();
        if (discovered.includes(num)) return false;
        discovered.push(num);
        // Keep a local fallback, and store the authoritative discovery on the account.
        if (window.currentUser) window.sessionDiscoveredRules.add(num);
        else localStorage.setItem('discoveredRules', JSON.stringify(discovered));
        // Show the rule immediately; persistence can finish in the background.
        window.openRuleBook(num);
        if (window.currentUser) {
            const metadata = { ...(window.currentUser.user_metadata || {}), [DISCOVERED_RULES_KEY]: discovered };
            const { data, error } = await window.supabaseClient.auth.updateUser({ data: metadata });
            if (!error && data?.user) window.currentUser = data.user;
        }
        return true;
    }

    window.openRuleBook = function(focusNum = null) {
        const discovered = getDiscovered();
        const visible = ALL_RULES.filter(r => discovered.includes(r.num));
        document.getElementById('ruleBook').style.display = 'flex';
        if (visible.length === 0) {
            document.getElementById('leftTitle').textContent = 'Your discoveries';
            document.getElementById('leftText').textContent = 'New rules you encounter will be collected here.';
            document.getElementById('leftNum').textContent = '';
            document.getElementById('rightNum').textContent = 'NOTHING DISCOVERED';
            document.getElementById('rightTitle').textContent = 'The board is yours';
            document.getElementById('rightText').textContent = 'Play games to discover Shakk’s unusual rules.';
            return;
        }
        const focusedIndex = Math.max(0, visible.findIndex(r => r.num === focusNum));
        const focused = visible[focusedIndex];
        document.getElementById('leftTitle').textContent = 'Discovered rules';
        document.getElementById('leftText').textContent = visible.length + ' rule' + (visible.length === 1 ? '' : 's') + ' found on this account.';
        document.getElementById('leftNum').textContent = visible.map(r => 'RULE ' + r.num + (r.num === focused.num ? '  •  OPEN' : '')).join('     /     ');
        document.getElementById('rightNum').textContent = 'RULE ' + focused.num + '  •  DISCOVERED';
        document.getElementById('rightTitle').textContent = focused.title;
        document.getElementById('rightText').textContent = focused.text;
    };
    window.closeRuleBook = function() {
        document.getElementById('ruleBook').style.display = 'none';
    };

    const pieces = {
        'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚',
        'P': '♙', 'N': '♘', 'B': '♗', 'R': '♖', 'Q': '♕', 'K': '♔'
    };

    function animatePieceMove(from, to) {
        const boardEl = document.getElementById('board');
        const fromSquare = boardEl?.querySelector(`[data-square="${from}"]`);
        const toSquare = boardEl?.querySelector(`[data-square="${to}"]`);
        if (!fromSquare || !toSquare) return;
        const fromRect = fromSquare.getBoundingClientRect();
        const toRect = toSquare.getBoundingClientRect();
        const dx = fromRect.left - toRect.left;
        const dy = fromRect.top - toRect.top;
        requestAnimationFrame(() => {
            const movedPiece = boardEl.querySelector(`[data-square="${to}"] .piece`);
            if (!movedPiece || typeof movedPiece.animate !== 'function') return;
            movedPiece.animate(
                [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'translate(0, 0)' }],
                { duration: 145, easing: 'cubic-bezier(.2,.75,.25,1)' }
            );
        });
    }

    function playBoardSound(kind = 'move') {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            soundContext ||= new AudioCtx();
            if (soundContext.state === 'suspended') soundContext.resume();
            const now = soundContext.currentTime;
            const oscillator = soundContext.createOscillator();
            const gain = soundContext.createGain();
            const presets = {
                move: [420, 300, 0.055],
                capture: [250, 145, 0.09],
                select: [560, 500, 0.025],
                special: [620, 880, 0.12]
            };
            const [from, to, duration] = presets[kind] || presets.move;
            oscillator.type = kind === 'capture' ? 'triangle' : 'sine';
            oscillator.frequency.setValueAtTime(from, now);
            oscillator.frequency.exponentialRampToValueAtTime(to, now + duration);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(kind === 'select' ? 0.035 : 0.075, now + 0.008);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
            oscillator.connect(gain); gain.connect(soundContext.destination);
            oscillator.start(now); oscillator.stop(now + duration + 0.01);
        } catch (_) { /* Audio is optional; gameplay must never depend on it. */ }
    }

    function fileToCol(file) { return file.charCodeAt(0) - 97; }
    function colToFile(col) { return String.fromCharCode(97 + col); }

    function getSpecialBrilliantMove(square) {
        const piece = window.chess.get(square);
        if (!piece || piece.type !== 'p') return null;
        const file = square[0];
        const rank = parseInt(square[1]);
        const color = piece.color;
        const aheadRank = color === 'w' ? rank + 1 : rank - 1;
        if (aheadRank < 1 || aheadRank > 8) return null;
        const aheadSquare = file + aheadRank;
        const aheadPiece = window.chess.get(aheadSquare);
        if (!aheadPiece || aheadPiece.type !== 'p' || aheadPiece.color === color) return null;
        const rightCol = fileToCol(file) + 1;
        if (rightCol > 7) return null;
        const rightSquare = colToFile(rightCol) + rank;
        if (window.chess.get(rightSquare)) return null;
        discoverRule(1); // Discover the rule when the situation appears
        return rightSquare;
    }

    async function loadElo() {
        if (!window.currentUser) return;
        const { data } = await window.supabaseClient.from('profiles').select('elo').eq('id', window.currentUser.id).single();
        if (data) window.myElo = data.elo;
        else {
            await window.supabaseClient.from('profiles').insert({ id: window.currentUser.id, elo: 200 });
            window.myElo = 200;
        }
        document.getElementById('eloDisplay').textContent = 'ELO: ' + window.myElo;
    }

    async function updateElos(winnerId, loserId) {
        const { data: w } = await window.supabaseClient.from('profiles').select('elo').eq('id', winnerId).single();
        if (w) await window.supabaseClient.from('profiles').update({ elo: w.elo + 20 }).eq('id', winnerId);
        const { data: l } = await window.supabaseClient.from('profiles').select('elo').eq('id', loserId).single();
        if (l) await window.supabaseClient.from('profiles').update({ elo: Math.max(100, l.elo - 10) }).eq('id', loserId);
        if (window.currentUser && (window.currentUser.id === winnerId || window.currentUser.id === loserId)) await loadElo();
    }

    window.doSignUp = async function() {
        const msg = document.getElementById("authMessage");
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        if (!email || !password) { msg.textContent = "Enter email and password"; return; }
        msg.textContent = "Creating account...";
        const { error } = await window.supabaseClient.auth.signUp({ email, password });
        msg.textContent = error ? "Error: " + error.message : "Account created! You can now sign in.";
    };

    window.doSignIn = async function() {
        const msg = document.getElementById("authMessage");
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        msg.textContent = "Signing in...";
        const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
        if (error) { msg.textContent = "Error: " + error.message; return; }
        window.currentUser = data.user;
        document.getElementById("welcome").textContent = "Welcome, " + email + "!";
        document.getElementById("auth").style.display = "none";
        document.getElementById("menu").style.display = "block";
        await syncDiscoveredRulesToAccount();
        await loadElo();
    };

    window.doSignOut = async function() {
        await window.supabaseClient.auth.signOut();
        window.currentUser = null;
        document.getElementById("auth").style.display = "block";
        document.getElementById("menu").style.display = "none";
        document.getElementById("game").style.display = "none";
    };

    window.startSingle = function() {
        window.mode = 'single';
        window.gameEnded = false;
        window.brilliantPawns = new Set();
        window.lastMoveSquares = [];
        window.chess.reset();
        window.selectedSquare = null;
        window.possibleMoves = [];
        showGame();
    };

    window.startOnline = async function() {
        window.mode = 'online';
        window.gameEnded = false;
        window.brilliantPawns = new Set();
        window.myColor = null;
        window.currentGameId = null;
        window.lastMoveSquares = [];
        document.getElementById('status').textContent = 'Finding Match...';
        document.getElementById('info').textContent = 'Looking for opponent...';
        showGame();
        const user = window.currentUser;
        if (!user) { document.getElementById('info').textContent = 'Not logged in'; return; }
        const { data: waiting } = await window.supabaseClient.from('games').select('*').eq('status', 'waiting').neq('white_player', user.id).limit(1);
        if (waiting && waiting.length > 0) {
            const game = waiting[0];
            const otherPlayer = game.white_player;
            const iAmWhite = Math.random() < 0.5;
            await window.supabaseClient.from('games').update({
                black_player: iAmWhite ? otherPlayer : user.id,
                white_player: iAmWhite ? user.id : otherPlayer,
                status: 'active'
            }).eq('id', game.id);
            window.currentGameId = game.id;
            window.myColor = iAmWhite ? 'white' : 'black';
            window.chess.load(game.fen || window.chess.fen());
            document.getElementById('info').textContent = 'Matched! You are ' + (window.myColor === 'white' ? 'White' : 'Black');
            subscribe();
        } else {
            const { data: newGame } = await window.supabaseClient.from('games').insert({
                white_player: user.id, status: 'waiting', fen: window.chess.fen()
            }).select().single();
            window.currentGameId = newGame.id;
            document.getElementById('info').textContent = 'Waiting for opponent...';
            subscribe();
        }
        renderBoard();
    };

    window.backToMenu = function() {
        if (window.channel) window.supabaseClient.removeChannel(window.channel);
        window.mode = null;
        window.currentGameId = null;
        window.myColor = null;
        document.getElementById('game').style.display = 'none';
        document.getElementById('menu').style.display = 'block';
        loadElo();
    };

    window.resetGame = function() {
        if (window.mode === 'single') {
            window.gameEnded = false;
            window.brilliantPawns = new Set();
            window.lastMoveSquares = [];
            window.chess.reset();
            window.selectedSquare = null;
            window.possibleMoves = [];
            renderBoard();
        }
    };

    function showGame() {
        document.getElementById('auth').style.display = 'none';
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        renderBoard();
    }

    function renderBoard() {
        const boardEl = document.getElementById('board');
        if (!boardEl) return;
        boardEl.innerHTML = '';
        const board = window.chess.board();
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                square.className = 'square ' + (isLight ? 'light' : 'dark');
                square.dataset.square = squareName;
                if (window.lastMoveSquares.includes(squareName)) square.classList.add('last-move');
                const file = String.fromCharCode(97 + col);
                const rank = 8 - row;
                const squareName = file + rank;
                const piece = board[row][col];
                if (piece) {
                    const span = document.createElement('span');
                    span.className = 'piece ' + (piece.color === 'w' ? 'white-piece' : 'black-piece');
                    if (piece.type === 'p' && window.brilliantPawns.has(squareName)) span.classList.add('brilliant');
                    const key = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                    span.textContent = pieces[key];
                    square.appendChild(span);
                }
                if (window.selectedSquare === squareName) square.classList.add('selected');
                if (window.possibleMoves.includes(squareName)) {
                    square.classList.add('possible');
                    if (piece) square.classList.add('capture-target');
                }
                if (col === 0) { const rankLabel = document.createElement('span'); rankLabel.className = 'coordinate rank-coordinate'; rankLabel.textContent = rank; square.appendChild(rankLabel); }
                if (row === 7) { const fileLabel = document.createElement('span'); fileLabel.className = 'coordinate file-coordinate'; fileLabel.textContent = file; square.appendChild(fileLabel); }
                square.onclick = () => onSquareClick(squareName);
                boardEl.appendChild(square);
            }
        }
        updateStatus();
    }

    function updateStatus() {
        const statusEl = document.getElementById('status');
        const infoEl = document.getElementById('info');
        if (!statusEl) return;
        if (window.mode === 'single') {
            const turn = window.chess.turn() === 'w' ? 'White' : 'Black';
            statusEl.textContent = window.chess.in_checkmate() ? 'Checkmate!' : (window.chess.in_check() ? turn + ' in check' : turn + ' to move');
            if (infoEl) infoEl.textContent = 'Local game';
            return;
        }
        if (!window.currentGameId || !window.myColor) {
            statusEl.textContent = 'Finding Match...';
            return;
        }
        const turn = window.chess.turn() === 'w' ? 'White' : 'Black';
        const myTurn = (window.chess.turn() === 'w' && window.myColor === 'white') || (window.chess.turn() === 'b' && window.myColor === 'black');
        if (window.chess.in_checkmate() && !window.gameEnded) {
            window.gameEnded = true;
            statusEl.textContent = 'Checkmate!';
            const winnerColor = window.chess.turn() === 'w' ? 'black' : 'white';
            handleGameEnd(winnerColor);
        } else {
            statusEl.textContent = window.chess.in_checkmate() ? 'Checkmate!' : (turn + ' to move ' + (myTurn ? '(You)' : '(Opponent)'));
        }
    }

    async function handleGameEnd(winnerColor) {
        if (window.mode !== 'online' || !window.currentGameId) return;
        const { data: game } = await window.supabaseClient.from('games').select('white_player, black_player').eq('id', window.currentGameId).single();
        if (!game) return;
        const winnerId = winnerColor === 'white' ? game.white_player : game.black_player;
        const loserId = winnerColor === 'white' ? game.black_player : game.white_player;
        await window.supabaseClient.from('games').update({ status: 'finished', winner: winnerId }).eq('id', window.currentGameId);
        await updateElos(winnerId, loserId);
        document.getElementById('info').textContent = 'Game over! ELO updated.';
    }

    function onSquareClick(square) {
        if (window.gameEnded) return;
        if (window.mode === 'online' && window.currentGameId && window.myColor) {
            const isMyTurn = (window.chess.turn() === 'w' && window.myColor === 'white') || (window.chess.turn() === 'b' && window.myColor === 'black');
            if (!isMyTurn) return;
        }
        if (window.selectedSquare) {
            const specialTarget = getSpecialBrilliantMove(window.selectedSquare);
            if (specialTarget === square) {
                const fromSquare = window.selectedSquare;
                const piece = window.chess.get(fromSquare);

                // Apply the custom sideways pawn move, then explicitly hand
                // the turn to the other color. chess.remove()/put() change the
                // board but do not create a chess move or advance the turn.
                window.chess.remove(fromSquare);
                window.chess.put(piece, square);
                window.brilliantPawns.delete(fromSquare);
                window.brilliantPawns.add(square);
                window.lastMoveSquares = [fromSquare, square];
                animatePieceMove(fromSquare, square);
                playBoardSound('special');

                const parts = window.chess.fen().split(' ');
                parts[1] = piece.color === 'w' ? 'b' : 'w';
                parts[3] = '-'; // A pawn move clears any en-passant target.
                parts[4] = '0'; // A pawn move resets the halfmove clock.
                if (piece.color === 'b') {
                    parts[5] = String(Number(parts[5]) + 1);
                }
                window.chess.load(parts.join(' '));
                if (window.mode === 'online' && window.currentGameId) {
                    window.supabaseClient.from('games').update({
                        fen: window.chess.fen(),
                        turn: window.chess.turn(),
                        updated_at: new Date().toISOString()
                    }).eq('id', window.currentGameId);
                }
                window.selectedSquare = null;
                window.possibleMoves = [];
                renderBoard();
                return;
            }
            const move = window.chess.move({ from: window.selectedSquare, to: square, promotion: 'q' });
            if (move) {
                window.lastMoveSquares = [move.from, move.to];
                animatePieceMove(move.from, move.to);
                playBoardSound(move.captured ? 'capture' : 'move');
                if (move.captured && window.brilliantPawns.has(square)) window.brilliantPawns.delete(square);
                if (window.brilliantPawns.has(window.selectedSquare)) {
                    window.brilliantPawns.delete(window.selectedSquare);
                    window.brilliantPawns.add(square);
                }
                if (window.mode === 'online' && window.currentGameId) {
                    window.supabaseClient.from('games').update({
                        fen: window.chess.fen(),
                        turn: window.chess.turn(),
                        updated_at: new Date().toISOString()
                    }).eq('id', window.currentGameId);
                }
                window.selectedSquare = null;
                window.possibleMoves = [];
                renderBoard();
                return;
            }
        }
        const piece = window.chess.get(square);
        if (piece && piece.color === window.chess.turn()) {
            playBoardSound('select');
            window.selectedSquare = square;
            let moves = window.chess.moves({ square: square, verbose: true }).map(m => m.to);
            moves = moves.filter(to => {
                const target = window.chess.get(to);
                if (piece.type === 'p' && target && target.type === 'p' && window.brilliantPawns.has(to)) return false;
                return true;
            });
            const special = getSpecialBrilliantMove(square);
            if (special) moves.push(special);
            window.possibleMoves = moves;
        } else {
            window.selectedSquare = null;
            window.possibleMoves = [];
        }
        renderBoard();
    }

    function subscribe() {
        if (window.channel) window.supabaseClient.removeChannel(window.channel);
        window.channel = window.supabaseClient.channel('game-' + window.currentGameId)
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'games', filter: 'id=eq.' + window.currentGameId }, (payload) => {
                const game = payload.new;
                const user = window.currentUser;
                if (game.status === 'active' && game.white_player && game.black_player && user) {
                    const positionChanged = !!game.fen && game.fen !== window.chess.fen();
                    if (game.white_player === user.id) window.myColor = 'white';
                    else if (game.black_player === user.id) window.myColor = 'black';
                    document.getElementById('info').textContent = 'Matched! You are ' + (window.myColor === 'white' ? 'White' : 'Black');
                    if (game.fen) window.chess.load(game.fen);
                    if (positionChanged) playBoardSound('move');
                    const remoteLastMove = window.chess.history({ verbose: true }).slice(-1)[0];
                    window.lastMoveSquares = remoteLastMove ? [remoteLastMove.from, remoteLastMove.to] : [];
                    window.selectedSquare = null;
                    window.possibleMoves = [];
                    renderBoard();
                } else if (game.fen && game.fen !== window.chess.fen()) {
                    window.chess.load(game.fen);
                    playBoardSound('move');
                    const remoteLastMove = window.chess.history({ verbose: true }).slice(-1)[0];
                    window.lastMoveSquares = remoteLastMove ? [remoteLastMove.from, remoteLastMove.to] : [];
                    window.selectedSquare = null;
                    window.possibleMoves = [];
                    renderBoard();
                }
            }).subscribe();
    }

    window.supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
        if (session) {
            window.currentUser = session.user;
            document.getElementById("welcome").textContent = "Welcome back!";
            document.getElementById("auth").style.display = "none";
            document.getElementById("menu").style.display = "block";
            await syncDiscoveredRulesToAccount();
            await loadElo();
        }
    });
    </script>
</body>
</html>
