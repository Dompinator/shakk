<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shakk - Chess</title>
    <link rel="stylesheet" href="style.css">
    <style>
    .brilliant {
        position: relative;
    }
    .brilliant::after {
        content: "!!";
        position: absolute;
        top: -8px;
        right: -8px;
        background: #22c55e;
        color: white;
        font-size: 12px;
        font-weight: bold;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 4px #22c55e;
    }
    </style>
</head>
<body>
    <div class="container">
        <div id="auth">
            <h1>Shakk Chess</h1>
            <p>Sign in or create an account to play</p>
            <input type="email" id="email" placeholder="Email"><br><br>
            <input type="password" id="password" placeholder="Password"><br><br>
            <button onclick="doSignIn()">Sign In</button>
            <button onclick="doSignUp()">Sign Up</button>
            <p id="authMessage"></p>
        </div>
        <div id="menu" style="display:none;">
            <h1>Shakk Chess</h1>
            <p id="welcome">Welcome!</p>
            <p id="eloDisplay">ELO: 200</p>
            <button onclick="startSingle()">Single Player</button>
            <button onclick="startOnline()">Find Online Match</button>
            <button onclick="doSignOut()">Sign Out</button>
        </div>
        <div id="game" style="display:none;">
            <h1>Shakk Chess</h1>
            <div id="status">White to move</div>
            <div id="board"></div>
            <div class="controls">
                <button onclick="backToMenu()">Back to Menu</button>
                <button onclick="resetGame()">Reset</button>
            </div>
            <p id="info"></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
    const SUPABASE_URL = 'https://devxzklnldwhyxrlorck.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_X7YnI_XIJUZi1tfklN6-FQ_RpVEDKy1';
    window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    window.currentUser = null;
    window.myElo = 200;
    window.chess = new Chess();
    window.mode = null;
    window.currentGameId = null;
    window.myColor = null;
    window.selectedSquare = null;
    window.possibleMoves = [];
    window.channel = null;
    window.gameEnded = false;
    window.brilliantPawns = new Set(); // squares with brilliant pawns

    const pieces = {
        'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚',
        'P': '♙', 'N': '♘', 'B': '♗', 'R': '♖', 'Q': '♕', 'K': '♔'
    };

    function fileToCol(file) { return file.charCodeAt(0) - 97; }
    function colToFile(col) { return String.fromCharCode(97 + col); }

    function getSpecialBrilliantMove(square) {
        const piece = window.chess.get(square);
        if (!piece || piece.type !== 'p') return null;
        const file = square[0];
        const rank = parseInt(square[1]);
        const color = piece.color;
        const aheadRank = color === 'w' ? rank + 1 : rank - 1;
        if (aheadRank < 1 || aheadRank > 8) return null;
        const aheadSquare = file + aheadRank;
        const aheadPiece = window.chess.get(aheadSquare);
        if (!aheadPiece || aheadPiece.type !== 'p' || aheadPiece.color === color) return null;
        // Can move 1 step to the right (increasing file)
        const rightCol = fileToCol(file) + 1;
        if (rightCol > 7) return null;
        const rightSquare = colToFile(rightCol) + rank;
        if (window.chess.get(rightSquare)) return null; // must be empty
        return rightSquare;
    }

    async function loadElo() {
        if (!window.currentUser) return;
        const { data } = await window.supabaseClient.from('profiles').select('elo').eq('id', window.currentUser.id).single();
        if (data) {
            window.myElo = data.elo;
        } else {
            await window.supabaseClient.from('profiles').insert({ id: window.currentUser.id, elo: 200 });
            window.myElo = 200;
        }
        document.getElementById('eloDisplay').textContent = 'ELO: ' + window.myElo;
    }

    async function updateElos(winnerId, loserId) {
        const { data: w } = await window.supabaseClient.from('profiles').select('elo').eq('id', winnerId).single();
        if (w) await window.supabaseClient.from('profiles').update({ elo: w.elo + 20 }).eq('id', winnerId);
        const { data: l } = await window.supabaseClient.from('profiles').select('elo').eq('id', loserId).single();
        if (l) {
            const newElo = Math.max(100, l.elo - 10);
            await window.supabaseClient.from('profiles').update({ elo: newElo }).eq('id', loserId);
        }
        if (window.currentUser && (window.currentUser.id === winnerId || window.currentUser.id === loserId)) await loadElo();
    }

    window.doSignUp = async function() {
        const msg = document.getElementById("authMessage");
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        if (!email || !password) { msg.textContent = "Enter email and password"; return; }
        msg.textContent = "Creating account...";
        const { error } = await window.supabaseClient.auth.signUp({ email, password });
        msg.textContent = error ? "Error: " + error.message : "Account created! You can now sign in.";
    };

    window.doSignIn = async function() {
        const msg = document.getElementById("authMessage");
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        msg.textContent = "Signing in...";
        const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
        if (error) { msg.textContent = "Error: " + error.message; return; }
        window.currentUser = data.user;
        document.getElementById("welcome").textContent = "Welcome, " + email + "!";
        document.getElementById("auth").style.display = "none";
        document.getElementById("menu").style.display = "block";
        await loadElo();
    };

    window.doSignOut = async function() {
        await window.supabaseClient.auth.signOut();
        window.currentUser = null;
        document.getElementById("auth").style.display = "block";
        document.getElementById("menu").style.display = "none";
        document.getElementById("game").style.display = "none";
    };

    window.startSingle = function() {
        window.mode = 'single';
        window.gameEnded = false;
        window.brilliantPawns = new Set();
        window.chess.reset();
        window.selectedSquare = null;
        window.possibleMoves = [];
        showGame();
    };

    window.startOnline = async function() {
        window.mode = 'online';
        window.gameEnded = false;
        window.brilliantPawns = new Set();
        window.myColor = null;
        window.currentGameId = null;
        document.getElementById('status').textContent = 'Finding Match...';
        document.getElementById('info').textContent = 'Looking for opponent...';
        showGame();
        const user = window.currentUser;
        if (!user) { document.getElementById('info').textContent = 'Not logged in'; return; }
        const { data: waiting } = await window.supabaseClient.from('games').select('*').eq('status', 'waiting').neq('white_player', user.id).limit(1);
        if (waiting && waiting.length > 0) {
            const game = waiting[0];
            const otherPlayer = game.white_player;
            const iAmWhite = Math.random() < 0.5;
            await window.supabaseClient.from('games').update({
                black_player: iAmWhite ? otherPlayer : user.id,
                white_player: iAmWhite ? user.id : otherPlayer,
                status: 'active'
            }).eq('id', game.id);
            window.currentGameId = game.id;
            window.myColor = iAmWhite ? 'white' : 'black';
            window.chess.load(game.fen || window.chess.fen());
            document.getElementById('info').textContent = 'Matched! You are ' + (window.myColor === 'white' ? 'White' : 'Black');
            subscribe();
        } else {
            const { data: newGame } = await window.supabaseClient.from('games').insert({
                white_player: user.id, status: 'waiting', fen: window.chess.fen()
            }).select().single();
            window.currentGameId = newGame.id;
            document.getElementById('info').textContent = 'Waiting for opponent...';
            subscribe();
        }
        renderBoard();
    };

    window.backToMenu = function() {
        if (window.channel) window.supabaseClient.removeChannel(window.channel);
        window.mode = null;
        window.currentGameId = null;
        window.myColor = null;
        document.getElementById('game').style.display = 'none';
        document.getElementById('menu').style.display = 'block';
        loadElo();
    };

    window.resetGame = function() {
        if (window.mode === 'single') {
            window.gameEnded = false;
            window.brilliantPawns = new Set();
            window.chess.reset();
            window.selectedSquare = null;
            window.possibleMoves = [];
            renderBoard();
        }
    };

    function showGame() {
        document.getElementById('auth').style.display = 'none';
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        renderBoard();
    }

    function renderBoard() {
        const boardEl = document.getElementById('board');
        if (!boardEl) return;
        boardEl.innerHTML = '';
        const board = window.chess.board();
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                square.className = 'square ' + (isLight ? 'light' : 'dark');
                const file = String.fromCharCode(97 + col);
                const rank = 8 - row;
                const squareName = file + rank;
                const piece = board[row][col];
                if (piece) {
                    const span = document.createElement('span');
                    span.className = 'piece';
                    if (piece.type === 'p' && window.brilliantPawns.has(squareName)) {
                        span.classList.add('brilliant');
                    }
                    const key = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                    span.textContent = pieces[key];
                    square.appendChild(span);
                }
                if (window.selectedSquare === squareName) square.classList.add('selected');
                if (window.possibleMoves.includes(squareName)) square.classList.add('possible');
                square.onclick = () => onSquareClick(squareName);
                boardEl.appendChild(square);
            }
        }
        updateStatus();
    }

    function updateStatus() {
        const statusEl = document.getElementById('status');
        const infoEl = document.getElementById('info');
        if (!statusEl) return;
        if (window.mode === 'single') {
            const turn = window.chess.turn() === 'w' ? 'White' : 'Black';
            statusEl.textContent = window.chess.in_checkmate() ? 'Checkmate!' : (window.chess.in_check() ? turn + ' in check' : turn + ' to move');
            if (infoEl) infoEl.textContent = 'Local game';
            return;
        }
        if (!window.currentGameId || !window.myColor) {
            statusEl.textContent = 'Finding Match...';
            return;
        }
        const turn = window.chess.turn() === 'w' ? 'White' : 'Black';
        const myTurn = (window.chess.turn() === 'w' && window.myColor === 'white') || (window.chess.turn() === 'b' && window.myColor === 'black');
        if (window.chess.in_checkmate() && !window.gameEnded) {
            window.gameEnded = true;
            statusEl.textContent = 'Checkmate!';
            const winnerColor = window.chess.turn() === 'w' ? 'black' : 'white';
            handleGameEnd(winnerColor);
        } else {
            statusEl.textContent = window.chess.in_checkmate() ? 'Checkmate!' : (turn + ' to move ' + (myTurn ? '(You)' : '(Opponent)'));
        }
    }

    async function handleGameEnd(winnerColor) {
        if (window.mode !== 'online' || !window.currentGameId) return;
        const { data: game } = await window.supabaseClient.from('games').select('white_player, black_player').eq('id', window.currentGameId).single();
        if (!game) return;
        const winnerId = winnerColor === 'white' ? game.white_player : game.black_player;
        const loserId = winnerColor === 'white' ? game.black_player : game.white_player;
        await window.supabaseClient.from('games').update({ status: 'finished', winner: winnerId }).eq('id', window.currentGameId);
        await updateElos(winnerId, loserId);
        document.getElementById('info').textContent = 'Game over! ELO updated.';
    }

    function onSquareClick(square) {
        if (window.gameEnded) return;
        if (window.mode === 'online' && window.currentGameId && window.myColor) {
            const isMyTurn = (window.chess.turn() === 'w' && window.myColor === 'white') || (window.chess.turn() === 'b' && window.myColor === 'black');
            if (!isMyTurn) return;
        }
        if (window.selectedSquare) {
            // Check if this is the special brilliant move
            const specialTarget = getSpecialBrilliantMove(window.selectedSquare);
            if (specialTarget === square) {
                // Execute special move
                const piece = window.chess.get(window.selectedSquare);
                window.chess.remove(window.selectedSquare);
                window.chess.put(piece, square);
                window.brilliantPawns.delete(window.selectedSquare);
                window.brilliantPawns.add(square);
                // Advance turn manually by loading FEN with flipped turn
                let fen = window.chess.fen();
                const parts = fen.split(' ');
                parts[1] = parts[1] === 'w' ? 'b' : 'w';
                window.chess.load(parts.join(' '));
                if (window.mode === 'online' && window.currentGameId) {
                    window.supabaseClient.from('games').update({
                        fen: window.chess.fen(),
                        turn: window.chess.turn(),
                        updated_at: new Date().toISOString()
                    }).eq('id', window.currentGameId);
                }
                window.selectedSquare = null;
                window.possibleMoves = [];
                renderBoard();
                return;
            }
            // Normal move
            const move = window.chess.move({ from: window.selectedSquare, to: square, promotion: 'q' });
            if (move) {
                // If captured a brilliant pawn, remove it from set
                if (move.captured && window.brilliantPawns.has(square)) {
                    window.brilliantPawns.delete(square);
                }
                // If the moving piece was brilliant, update its square
                if (window.brilliantPawns.has(window.selectedSquare)) {
                    window.brilliantPawns.delete(window.selectedSquare);
                    window.brilliantPawns.add(square);
                }
                if (window.mode === 'online' && window.currentGameId) {
                    window.supabaseClient.from('games').update({
                        fen: window.chess.fen(),
                        turn: window.chess.turn(),
                        updated_at: new Date().toISOString()
                    }).eq('id', window.currentGameId);
                }
                window.selectedSquare = null;
                window.possibleMoves = [];
                renderBoard();
                return;
            }
        }
        const piece = window.chess.get(square);
        if (piece && piece.color === window.chess.turn()) {
            window.selectedSquare = square;
            let moves = window.chess.moves({ square: square, verbose: true }).map(m => m.to);
            // Filter out pawn captures of brilliant pawns
            moves = moves.filter(to => {
                const target = window.chess.get(to);
                if (piece.type === 'p' && target && target.type === 'p' && window.brilliantPawns.has(to)) return false;
                return true;
            });
            // Add special brilliant move if available
            const special = getSpecialBrilliantMove(square);
            if (special) moves.push(special);
            window.possibleMoves = moves;
        } else {
            window.selectedSquare = null;
            window.possibleMoves = [];
        }
        renderBoard();
    }

    function subscribe() {
        if (window.channel) window.supabaseClient.removeChannel(window.channel);
        window.channel = window.supabaseClient.channel('game-' + window.currentGameId)
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'games', filter: 'id=eq.' + window.currentGameId }, (payload) => {
                const game = payload.new;
                const user = window.currentUser;
                if (game.status === 'active' && game.white_player && game.black_player && user) {
                    if (game.white_player === user.id) window.myColor = 'white';
                    else if (game.black_player === user.id) window.myColor = 'black';
                    document.getElementById('info').textContent = 'Matched! You are ' + (window.myColor === 'white' ? 'White' : 'Black');
                    if (game.fen) window.chess.load(game.fen);
                    window.selectedSquare = null;
                    window.possibleMoves = [];
                    renderBoard();
                } else if (game.fen && game.fen !== window.chess.fen()) {
                    window.chess.load(game.fen);
                    window.selectedSquare = null;
                    window.possibleMoves = [];
                    renderBoard();
                }
            }).subscribe();
    }

    window.supabaseClient.auth.getSession().then(async ({ data: { session } }) => {
        if (session) {
            window.currentUser = session.user;
            document.getElementById("welcome").textContent = "Welcome back!";
            document.getElementById("auth").style.display = "none";
            document.getElementById("menu").style.display = "block";
            await loadElo();
        }
    });
    </script>
</body>
</html>
