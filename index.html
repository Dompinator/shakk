<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shakk - Chess</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="menu">
            <h1>Shakk Chess</h1>
            <p>Choose how you want to play</p>
            <button id="singleBtn">Single Player</button>
            <button id="onlineBtn">Find Online Match</button>
        </div>
        <div id="game" style="display:none;">
            <h1>Shakk Chess</h1>
            <div id="status">White to move</div>
            <div id="board"></div>
            <div class="controls">
                <button id="backBtn">Back to Menu</button>
                <button id="resetBtn">Reset Game</button>
            </div>
            <p id="info"></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
    // Minimal working version - attach listeners after load
    window.addEventListener('DOMContentLoaded', function() {
        document.getElementById('singleBtn').onclick = function() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('status').textContent = 'Single Player - White to move';
            document.getElementById('info').textContent = 'Local game started';
        };
        document.getElementById('onlineBtn').onclick = function() {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            document.getElementById('status').textContent = 'Finding Match...';
            document.getElementById('info').textContent = 'Connecting to Supabase...';
            // Real matchmaking code can go here later
        };
        document.getElementById('backBtn').onclick = function() {
            document.getElementById('menu').style.display = 'block';
            document.getElementById('game').style.display = 'none';
        };
    });
    </script>
</body>
</html>
