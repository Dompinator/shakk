<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shakk - Chess</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Auth -->
        <div id="auth">
            <h1>Shakk Chess</h1>
            <p>Sign in or create an account to play</p>
            <input type="email" id="email" placeholder="Email"><br><br>
            <input type="password" id="password" placeholder="Password"><br><br>
            <button onclick="doSignIn()">Sign In</button>
            <button onclick="doSignUp()">Sign Up</button>
            <p id="authMessage"></p>
        </div>

        <!-- Menu -->
        <div id="menu" style="display:none;">
            <h1>Shakk Chess</h1>
            <p id="welcome">Welcome!</p>
            <button onclick="startSingle()">Single Player</button>
            <button onclick="startOnline()">Find Online Match</button>
            <button onclick="doSignOut()">Sign Out</button>
        </div>

        <!-- Game -->
        <div id="game" style="display:none;">
            <h1>Shakk Chess</h1>
            <div id="status">White to move</div>
            <div id="board"></div>
            <div class="controls">
                <button onclick="backToMenu()">Back to Menu</button>
                <button onclick="resetGame()">Reset</button>
            </div>
            <p id="info"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script>
    const SUPABASE_URL = 'https://devxzklnldwhyxrlorck.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_X7YnI_XIJUZi1tfklN6-FQ_RpVEDKy1';
    let supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let chess = new Chess();
    let mode = null;
    let currentGameId = null;
    let myColor = null;
    let selectedSquare = null;
    let possibleMoves = [];
    let channel = null;
    let currentUser = null;

    const pieces = {
        'p': '♟', 'n': '♞', 'b': '♝', 'r': '♜', 'q': '♛', 'k': '♚',
        'P': '♙', 'N': '♘', 'B': '♗', 'R': '♖', 'Q': '♕', 'K': '♔'
    };

    function showAuth() {
        document.getElementById('auth').style.display = 'block';
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game').style.display = 'none';
    }
    function showMenu() {
        document.getElementById('auth').style.display = 'none';
        document.getElementById('menu').style.display = 'block';
        document.getElementById('game').style.display = 'none';
    }
    function showGame() {
        document.getElementById('auth').style.display = 'none';
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        renderBoard();
    }

    function renderBoard() {
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';
        const board = chess.board();
        for (let row = 0; row < 8; row++) {
            for (let col = 0; col < 8; col++) {
                const square = document.createElement('div');
                const isLight = (row + col) % 2 === 0;
                square.className = 'square ' + (isLight ? 'light' : 'dark');
                const file = String.fromCharCode(97 + col);
                const rank = 8 - row;
                const squareName = file + rank;
                const piece = board[row][col];
                if (piece) {
                    const span = document.createElement('span');
                    span.className = 'piece';
                    const key = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                    span.textContent = pieces[key];
                    square.appendChild(span);
                }
                if (selectedSquare === squareName) square.classList.add('selected');
                if (possibleMoves.includes(squareName)) square.classList.add('possible');
                square.onclick = () => onSquareClick(squareName);
                boardEl.appendChild(square);
            }
        }
        updateStatus();
    }

    function updateStatus() {
        const statusEl = document.getElementById('status');
        const infoEl = document.getElementById('info');
        if (mode === 'single') {
            const turn = chess.turn() === 'w' ? 'White' : 'Black';
            statusEl.textContent = chess.in_checkmate() ? 'Checkmate!' : (chess.in_check() ? turn + ' in check' : turn + ' to move');
            infoEl.textContent = 'Local game';
            return;
        }
        if (!currentGameId) {
            statusEl.textContent = 'Finding Match...';
            return;
        }
        const turn = chess.turn() === 'w' ? 'White' : 'Black';
        const myTurn = (chess.turn() === 'w' && myColor === 'white') || (chess.turn() === 'b' && myColor === 'black');
        statusEl.textContent = chess.in_checkmate() ? 'Checkmate!' : (turn + ' to move ' + (myTurn ? '(You)' : '(Opponent)'));
    }

    function onSquareClick(square) {
        if (mode === 'online' && currentGameId) {
            const isMyTurn = (chess.turn() === 'w' && myColor === 'white') || (chess.turn() === 'b' && myColor === 'black');
            if (!isMyTurn) return;
        }
        if (selectedSquare) {
            const move = chess.move({ from: selectedSquare, to: square, promotion: 'q' });
            if (move) {
                if (mode === 'online' && currentGameId) {
                    supabase.from('games').update({
                        fen: chess.fen(),
                        turn: chess.turn(),
                        updated_at: new Date().toISOString()
                    }).eq('id', currentGameId);
                }
                selectedSquare = null;
                possibleMoves = [];
                renderBoard();
                return;
            }
        }
        const piece = chess.get(square);
        if (piece && piece.color === chess.turn()) {
            selectedSquare = square;
            possibleMoves = chess.moves({ square: square, verbose: true }).map(m => m.to);
        } else {
            selectedSquare = null;
            possibleMoves = [];
        }
        renderBoard();
    }

    window.doSignUp = async function() {
        const msg = document.getElementById('authMessage');
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        if (!email || !password) { msg.textContent = 'Enter email and password'; return; }
        msg.textContent = 'Creating account...';
        const { error } = await supabase.auth.signUp({ email, password });
        msg.textContent = error ? 'Error: ' + error.message : 'Account created! You can now sign in.';
    };

    window.doSignIn = async function() {
        const msg = document.getElementById('authMessage');
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        msg.textContent = 'Signing in...';
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
            msg.textContent = 'Error: ' + error.message;
        } else {
            currentUser = data.user;
            document.getElementById('welcome').textContent = 'Welcome, ' + email + '!';
            showMenu();
        }
    };

    window.doSignOut = async function() {
        await supabase.auth.signOut();
        currentUser = null;
        showAuth();
    };

    window.startSingle = function() {
        mode = 'single';
        chess.reset();
        selectedSquare = null;
        possibleMoves = [];
        showGame();
    };

    window.startOnline = async function() {
        mode = 'online';
        document.getElementById('status').textContent = 'Finding Match...';
        document.getElementById('info').textContent = 'Looking for opponent...';
        showGame();
        if (!currentUser) { document.getElementById('info').textContent = 'Not logged in'; return; }

        const { data: waiting } = await supabase.from('games').select('*').eq('status', 'waiting').is('black_player', null).limit(1);
        if (waiting && waiting.length > 0) {
            const game = waiting[0];
            await supabase.from('games').update({ black_player: currentUser.id, status: 'active' }).eq('id', game.id);
            currentGameId = game.id;
            myColor = 'black';
            chess.load(game.fen || chess.fen());
            document.getElementById('info').textContent = 'You are Black';
            subscribe();
        } else {
            const { data: newGame } = await supabase.from('games').insert({
                white_player: currentUser.id,
                status: 'waiting',
                fen: chess.fen()
            }).select().single();
            currentGameId = newGame.id;
            myColor = 'white';
            document.getElementById('info').textContent = 'You are White - waiting...';
            subscribe();
        }
        renderBoard();
    };

    function subscribe() {
        if (channel) supabase.removeChannel(channel);
        channel = supabase.channel('game-' + currentGameId)
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'games', filter: 'id=eq.' + currentGameId }, (payload) => {
                if (payload.new.fen && payload.new.fen !== chess.fen()) {
                    chess.load(payload.new.fen);
                    selectedSquare = null;
                    possibleMoves = [];
                    renderBoard();
                }
                if (payload.new.status === 'active' && myColor === 'white') {
                    document.getElementById('info').textContent = 'Opponent joined! You are White';
                }
            }).subscribe();
    }

    window.backToMenu = function() {
        if (channel) supabase.removeChannel(channel);
        mode = null;
        currentGameId = null;
        showMenu();
    };

    window.resetGame = function() {
        if (mode === 'single') {
            chess.reset();
            selectedSquare = null;
            possibleMoves = [];
            renderBoard();
        }
    };

    // Check existing session
    supabase.auth.getSession().then(({ data: { session } }) => {
        if (session) {
            currentUser = session.user;
            document.getElementById('welcome').textContent = 'Welcome back!';
            showMenu();
        }
    });
    </script>
</body>
</html>
